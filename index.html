function head(title,back=true){return `<header><div class="bar">${back?`<button class="back" onclick="goBack()">‹ 戻る</button>`:''}<div class="title">${title}</div></div></header>`}
function home(){return `${head('二次検定対策',false)}<main class="wrap"><section class="hero"><h1>1級建築施工管理技士</h1><p>第二次検定・過去問10年分 学習Webアプリ</p></section><div class="seg">${['choice','tf','written'].map(m=>`<button class="${mode===m?'active':''}" onclick="mode='${m}';app()">${m==='choice'?'選択式':m==='tf'?'正誤':'記述'}</button>`).join('')}</div><div class="card"><div class="qrow"><b>学習進捗</b><span>${Object.values(state).filter(x=>x?.answered).length}問回答済み</span></div></div><h3>年度を選択</h3><div class="grid">${years.map(y=>`<button class="year" onclick="year='${y}';screen='year';app()"><strong>${era(y)}</strong><small>問題1～6</small></button>`).join('')}</div><div class="card"><button class="secondary" onclick="if(confirm('学習記録をすべて消しますか？')){state={};save();app()}">学習記録をリセット</button><p class="notice">出典：提供された「過去問10年分」「回答10年分」。解答試案のない選択問題については、自動的に正解を作成していません。</p></div></main>`}
function yearScreen(){let d=DATA[year], qs=d.questions||{};return `${head(era(year))}<main class="wrap"><div class="card"><b>${mode==='choice'?'選択式':mode==='tf'?'正誤トレーニング':'記述問題'}</b><p class="muted">問題を選んで開始してください。</p></div>${[1,2,3,4,5,6].filter(n=>qs[n]).map(n=>{let k=`${year}-${n}-${mode}`,s=state[k];return `<button class="qbtn" onclick="qno=${n};itemIndex=0;selected=null;submitted=false;showAnswer=false;written='';screen='question';app()"><div class="qrow"><div><b>問題${n}</b><div class="muted">${n<=4?'記述問題':'選択・法規問題'}</div></div><span class="pill">${s?.answered?(s.correct===true?'正解':'回答済み'):'未回答'}</span></div></button>`}).join('')}<p class="notice">※ 原本の選択問題は五肢択一式です。構造化できている小問はタップ式で採点し、その他は原文を表示して解答試案を確認できます。</p></main>`}
function questionScreen(){let d=DATA[year],q=clean(d.questions[qno]||''),ans=clean(d.answers?.[qno]||'');if(mode==='written')return `${head(`${era(year)}・問題${qno}`)}<main class="wrap"><div class="card"><span class="pill">記述</span><h3>問題文</h3><div class="question">${esc(q)}</div></div><div class="card"><h3>あなたの答案</h3><textarea class="textarea" oninput="written=this.value">${esc(written)}</textarea><div class="actions"><button class="primary" onclick="mark(null);showAnswer=true;app()">答案を確認する</button><button class="secondary" onclick="showAnswer=!showAnswer;app()">${showAnswer?'解答を隠す':'解答試案を見る'}</button></div>${showAnswer?`<div class="answer">${esc(ans||'この問題の解答試案は収録されていません。')}</div>`:''}</div></main>`;
if(mode==='tf')return `${head(`${era(year)}・問題${qno}`)}<main class="wrap"><div class="card"><span class="pill">正誤</span><h3>原文を確認して自己判定</h3><div class="question">${esc(q)}</div><div class="actions"><button class="primary" onclick="mark(true);submitted=true;showAnswer=true;app()">○ 自分の理解と一致</button><button class="secondary" onclick="mark(false);submitted=true;showAnswer=true;app()">× 一致しない</button></div>${showAnswer?`<div class="answer"><b>解答試案</b><br>${esc(ans||'収録なし')}</div>`:''}</div></main>`;
let items=d.choiceItems?.[qno]||[];if(mode==='choice'&&items.length){let it=items[itemIndex],ok=submitted&&selected===it.correctIndex;return `${head(`${era(year)}・問題${qno}`)}<main class="wrap"><div class="card"><div class="qrow"><b>小問 ${itemIndex+1} / ${items.length}</b><span class="pill">${it.correctIndex!=null?'自動採点':'自己採点'}</span></div><div class="question" style="margin-top:12px">${esc(it.prompt)}</div>${it.options.map((o,i)=>`<button class="choice ${submitted&&i===it.correctIndex?'good':''} ${submitted&&i===selected&&i!==it.correctIndex?'bad':''}" ${submitted?'disabled':''} onclick="answerChoice(${i})">${i+1}. ${esc(o)}</button>`).join('')}${submitted?`<div class="feedback ${ok?'goodbox':'badbox'}">${it.correctIndex!=null?(ok?'正解！':'不正解。正解は '+(it.correctIndex+1)+'番です。'):'回答を記録しました。'}</div><div class="actions"><button class="secondary" onclick="showAnswer=!showAnswer;app()">${showAnswer?'解答を隠す':'解答を確認'}</button>${itemIndex+1<items.length?`<button class="primary" onclick="itemIndex++;selected=null;submitted=false;showAnswer=false;app()">次の小問へ</button>`:`<button class="primary" onclick="mark(${it.correctIndex!=null?ok:'null'});goBack()">問題を完了</button>`}</div>${showAnswer?`<div class="answer">${esc(ans||'解答試案なし')}</div>`:''}`:''}</div></main>`}
return `${head(`${era(year)}・問題${qno}`)}<main class="wrap"><div class="card"><span class="pill">原本表示</span><h3>問題文</h3><p class="muted">原本の五肢択一式です。PDFから抽出した本文を表示しています。</p><div class="question">${esc(q)}</div><div class="actions"><button class="primary" onclick="showAnswer=!showAnswer;mark(null);app()">${showAnswer?'解答を隠す':'解答試案を見る'}</button></div>${showAnswer?`<div class="answer">${esc(ans||'この問題の解答試案は収録されていません。')}</div>`:''}</div></main>`}
function answerChoice(i){selected=i;submitted=true;app()}function goBack(){if(screen==='question'){screen='year'}else if(screen==='year'){screen='home'}app()}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js');app();
</script></body></html>
